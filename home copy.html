<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>企業名 - ホーム</title>
  <style>
    body {
      margin: 0;
      font-family: 'Helvetica Neue', sans-serif;
      color: #333;
      background-color: #fff;
    }

    header {
      padding: 1rem 2rem;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.5rem;
    }

    nav a {
      color: #333;
      text-decoration: none;
      margin-left: 1.5rem;
      font-weight: bold;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .hero {
    padding: 10rem 2rem;
    text-align: center;
    color: white;
    background-image: url('images/main.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    position: relative;
    }

    .hero::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-color: rgba(0, 0, 0, 0.4); 
    z-index: 1;
    }

    .hero h2, .hero p {
    position: relative;
    z-index: 2;
    }

    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.9rem;
      border-top: 1px solid #ddd;
      margin-top: 4rem;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        background-attachment: scroll;
      }

      nav {
        margin-top: 0.5rem;
      }

      nav a {
        margin-left: 0;
        margin-right: 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>サードコミュニティ</h1>
    <nav>
      <a href="#about">団体概要</a>
      <a href="#services">活動紹介</a>
      <a href="#contact">お問い合わせ</a>
    </nav>
  </header>

  <section class="hero">
    <h2></h2>
    <p>学習支援・地域活動・ボランティアなどを起点としたコミュニティづくりを。</p>
  </section>

  <section style="padding: 4rem 2rem; background-color: #f9f9f9;">
    <h2 style="text-align: center; margin-bottom: 2rem;">活動紹介</h2>
    <div style="
        display: flex;
        flex-direction: column;
        gap: 2.5rem;
        max-width: 700px;
        margin: 0 auto;
    ">
        <div style="background: #fff; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.08);">
        <img src="images/careersupport.JPG" alt="学習・教育支援" style="width: 100%; display: block;">
        <div style="padding: 1.5rem;">
            <h3 style="margin-top: 0;">学習・教育支援</h3>
            <p>適切な写真がありません</p>
        </div>
        </div>

        <div style="background: #fff; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.08);">
        <img src="images/careersupport.JPG" alt="進路・キャリア支援" style="width: 100%; display: block;">
        <div style="padding: 1.5rem;">
            <h3 style="margin-top: 0;">進路・キャリア支援</h3>
            <p>進路・キャリアについて身近に相談できる存在に</p>
        </div>
        </div>

        <div style="background: #fff; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.08);">
        <img src="images/community.jpg" alt="学習支援" style="width: 100%; display: block;">
        <div style="padding: 1.5rem;">
            <h3 style="margin-top: 0;">地域活性化やコミュニティ・居場所づくり</h3>
            <p>地域の活動に参加しています</p>
        </div>
        </div>
    </div>
    </section>

  <footer>
    &copy; 2025 特定非営利活動法人サードコミュニティ. All rights reserved.
  </footer>
</body>
</html>
